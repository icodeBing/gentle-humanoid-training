defaults:
  - /task/G1/G1@_here_
  - _self_

name: G1SETTLE
max_episode_length: 1500

viewer:
  resolution: [1280, 720]
  lookat: [0., 0., 0.8]
  eye: [3.2, 3.2, 1.8]

robot:
  name: g1

command:
  _target_: active_adaptation.envs.mdp.commands.standing_impedance.StandingImpedanceCommand
  max_force: 60.0
  net_force_limit: 60.0
  net_torque_limit: 35.0
  compliance: true
  hand_offset: 0.20
  hand_stiffness_range: [5.0, 250.0]
  safe_force_range: [5.0, 15.0]
  force_time_range: [300, 900]
  ramp_time_range: [40, 100]
  body_mass: 35.0
  body_damping: 45.0
  body_vel_limit: 0.8
  body_acc_limit: 2.0
  drive_mass: 0.1
  drive_damping: 2.0
  drive_vel_limit: 4.0
  drive_acc_limit: 1000.0

action:
  _target_: active_adaptation.envs.mdp.action.JointPosition
  action_scaling:
    .*elbow_joint: 1.0
    .*shoulder.*: 1.0
    .*wrist.*: 1.0
    .*hip_roll.*: 0.25
    .*hip_yaw.*: 0.25
    .*hip_pitch.*: 0.5
    .*knee.*: 0.5
    .*waist.*: 0.25
    .*ankle.*: 0.5
  max_delay: 4
  alpha: [0.9, 0.9]
  alpha_wide: [0.8, 1.0]
  alpha_jit_scale: 0.025
  boot_protect: true

observation:
  policy:
    command: {}
    target_joint_pos_obs: {}
    target_projected_gravity_b: {}
    root_linvel_b: {ema: 0.2}
    root_linvel_history: {history_steps: [0, 1, 2, 3, 4], noise_std: 0.02}
    root_ang_vel_history: {history_steps: [0, 1, 2, 3, 4], noise_std: 0.05}
    projected_gravity_history: {history_steps: [0, 1, 2, 3, 4], noise_std: 0.01}
    joint_pos_history: {history_steps: [0, 1, 2, 3, 4, 8], noise_std: 0.005}
    prev_actions: {steps: 3}
  priv:
    force_priv: {}
    body_height: {body_names: ["pelvis", "torso_link", ".*ankle_roll_link"]}
    contact_forces: {body_names: ".*ankle_roll_link"}
    root_linvel_b: {ema: 0.2}
    root_ang_vel_history: {history_steps: [0, 1, 2, 3, 4, 5, 6, 7, 8], noise_std: 0.0}
    projected_gravity_history: {history_steps: [0, 1, 2, 3, 4, 5, 6, 7, 8], noise_std: 0.0}
    joint_pos_history: {history_steps: [0, 1, 2, 3, 4, 5, 6, 7, 8], noise_std: 0.0}
    applied_action: {}
    applied_torque: {}
  priv_critic:
    cum_error: {}

reward:
  _student_train_: false
  standing:
    force_target_tracking: {weight: 2.0}
    force_target_vel_tracking: {weight: 1.0}
    force_reward: {weight: 1.0}
    force_exd_penalty: {weight: 0.25}
    stand_height: {weight: 2.0}
    stand_upright: {weight: 2.0}
    stand_lower_body: {weight: 1.0}
    body_yield_velocity: {weight: 2.0}
  loco:
    survival: {weight: 5.0, enabled: true}
    impact_force_l2: {weight: 4.0, enabled: true, body_names: ".*ankle_roll_link"}
    feet_slip: {weight: 3.0, enabled: true, body_names: ".*ankle_roll_link"}
    joint_vel_l2: {weight: 0.0005, enabled: true, joint_names: ".*"}
    action_rate_l2: {weight: 0.1, enabled: true}
    joint_pos_limits: {weight: 1.0, joint_names: ".*", soft_factor: 0.9, enabled: true}

randomization:
  perturb_body_com:
    body_names: ["pelvis", "torso_link"]
    com_range: [-0.02, 0.02]
  perturb_body_materials:
    body_names: ".*ankle_roll_link"
    static_friction_range: [0.3, 1.6]
    dynamic_friction_frac_range: [0.75, 1.0]
    restitution_range: [0.0, 0.2]
  motor_params_implicit:
    stiffness_range:
      .*: [0.9, 1.1]
    damping_range:
      .*: [0.9, 1.1]
    armature_range:
      .*: [0.75, 1.25]
  random_joint_offset:
    .*: [-0.01, 0.01]

termination:
  fall_over: {xy_thres: 0.8, z_thres: 0.5}
